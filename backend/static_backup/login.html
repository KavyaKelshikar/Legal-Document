<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Legal Document Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }
        .login-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            background: var(--accent-glow);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-glow);
        }
        .login-card h2 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 0.95rem;
            transition: all var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .demo-credentials {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="login-logo">⚖</div>
        <h2>Welcome Back</h2>
        <p>Sign in to your AI Legal Workspace</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="admin@legalsystem.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-login">Sign In</button>
        </form>

        <div class="demo-credentials">
            <strong>Demo Mode:</strong> Any email and password will work to access the system.
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulate a login delay
            const btn = document.querySelector('.btn-login');
            btn.textContent = "Signing in...";
            btn.disabled = true;
            
            setTimeout(() => {
                window.location.href = "/app";
            }, 800);
        });
    </script>
</body>
</html>
